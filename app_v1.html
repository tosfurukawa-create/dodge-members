<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d47a1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="出場管理">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>ドッジボール 出場メンバー管理</title>
<style>
:root{
  --primary:#1565c0; --primary-dark:#0d47a1; --primary-light:#e3f0fd;
  --accent:#ef6c00; --accent-light:#fff3e0;
  --danger:#d32f2f; --danger-light:#fdecea;
  --ok:#2e7d32; --ok-light:#e8f5e9;
  --bg:#eef2f7; --card:#ffffff; --text:#1a2733; --muted:#68788a; --line:#dde5ee;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; font-size:16px;}

/* ===== ヘッダー ===== */
#hdr{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  color:#fff; padding:calc(8px + env(safe-area-inset-top)) 12px 10px;
  box-shadow:0 2px 8px rgba(13,71,161,.3);
}
#hdr .t1{display:flex; align-items:center; justify-content:space-between; gap:8px;}
#hdr .app-name{font-size:14px; font-weight:700; letter-spacing:.05em; opacity:.95;}
#hdr .team-name{font-size:12px; opacity:.85; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:50%;}
#dayChip{
  margin-top:8px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  background:rgba(255,255,255,.16); border:1.5px solid rgba(255,255,255,.5); color:#fff;
  border-radius:12px; padding:9px 12px; font-size:15px; font-weight:700;
}
#dayChip .sub{font-weight:500; font-size:13px; opacity:.9; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ===== メイン ===== */
main{padding:12px 12px 8px; max-width:560px; margin:0 auto;}
.view{display:none;}
.view.on{display:block;}
h2.sec{font-size:14px; color:var(--muted); font-weight:700; margin:16px 4px 8px; letter-spacing:.04em;}

.card{background:var(--card); border-radius:14px; padding:14px; margin:10px 0; box-shadow:0 1px 4px rgba(16,42,67,.08);}

.empty{text-align:center; padding:36px 16px; color:var(--muted);}
.empty .big{font-size:44px; margin-bottom:10px;}
.empty p{margin:6px 0 16px; font-size:14px;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; border-radius:12px; padding:12px 18px; font-size:15px; font-weight:700;
  background:var(--primary); color:#fff; box-shadow:0 2px 6px rgba(21,101,192,.3);
}
.btn.block{display:flex; width:100%;}
.btn.ghost{background:#fff; color:var(--primary); border:1.5px solid var(--primary); box-shadow:none;}
.btn.gray{background:#e6edf5; color:var(--text); box-shadow:none;}
.btn.danger{background:var(--danger-light); color:var(--danger); box-shadow:none;}
.btn.sm{padding:7px 12px; font-size:13px; border-radius:10px;}
.btn:active{transform:scale(.97);}

/* ===== 試合カード ===== */
.match-card{background:#fff; border-radius:14px; padding:12px 14px; margin:10px 0; box-shadow:0 1px 4px rgba(16,42,67,.08);}
.match-card .row1{display:flex; align-items:center; gap:8px;}
.match-card .mno{font-size:16px; font-weight:800; color:var(--primary-dark);}
.match-card .fmt{background:var(--primary-light); color:var(--primary); font-weight:700; border-radius:8px; padding:2px 8px; font-size:12px;}
.match-card .opp{font-size:15px; font-weight:600; margin-top:2px; word-break:break-all;}
.match-card .row2{display:flex; align-items:center; gap:10px; margin-top:6px; font-size:13px; color:var(--muted); flex-wrap:wrap;}
.match-card .cnt-ok{color:var(--ok); font-weight:700;}
.match-card .cnt-ng{color:var(--danger); font-weight:700;}
.match-card .jmp{color:var(--accent); font-weight:700;}
.match-card .row3{display:flex; gap:8px; margin-top:10px;}
.match-card .row3 .btn{flex:1;}

/* ===== 出場回数 ===== */
.sort-row{display:flex; gap:6px; margin:10px 0;}
.sort-row button{
  flex:1; border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:8px 4px;
  font-size:13px; font-weight:600; color:var(--muted);
}
.sort-row button.on{border-color:var(--primary); color:var(--primary); background:var(--primary-light);}
.crow{display:flex; align-items:center; gap:10px; padding:10px 12px; background:#fff; border-radius:12px; margin:6px 0; box-shadow:0 1px 3px rgba(16,42,67,.06);}
.crow .num{
  width:34px; height:34px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;
}
.crow .info{flex:1; min-width:0;}
.crow .nm{font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.crow .bar{height:8px; background:#e9eef5; border-radius:5px; overflow:hidden; margin-top:5px;}
.crow .bar i{display:block; height:100%; background:var(--primary); border-radius:5px; transition:width .3s;}
.crow .games{font-size:11px; color:var(--muted); margin-top:4px; word-break:break-all;}
.crow .cntbox{text-align:center; flex-shrink:0; min-width:52px;}
.crow .cnt{font-size:22px; font-weight:800; color:var(--primary-dark);}
.crow .cnt small{font-size:12px; font-weight:600; color:var(--muted);}
.crow.zero .cnt{color:var(--danger);}
.crow.zero{border:1.5px solid #f5c6c2;}
.zero-badge{display:inline-block; background:var(--danger-light); color:var(--danger); font-size:11px; font-weight:700; border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:2px;}
.summary{display:flex; gap:8px; margin:4px 0 10px;}
.summary .box{flex:1; background:#fff; border-radius:12px; padding:10px; text-align:center; box-shadow:0 1px 3px rgba(16,42,67,.06);}
.summary .box b{display:block; font-size:20px; color:var(--primary-dark);}
.summary .box span{font-size:11px; color:var(--muted); font-weight:600;}

/* ===== ベンチ / 名簿 ===== */
.mrow{display:flex; align-items:center; gap:10px; padding:10px 12px; background:#fff; border-radius:12px; margin:6px 0; box-shadow:0 1px 3px rgba(16,42,67,.06);}
.mrow .num{width:34px; height:34px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;}
.mrow .nm{flex:1; font-weight:700; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mrow.bench-row{border:1.5px solid transparent;}
.mrow.bench-row.sel{border-color:var(--primary); background:var(--primary-light);}
.mrow .chk{width:26px; height:26px; border-radius:8px; border:2px solid #c3cfdd; display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; flex-shrink:0;}
.mrow.sel .chk{background:var(--primary); border-color:var(--primary);}
.bench-count{font-size:14px; font-weight:700; color:var(--primary-dark); text-align:center; background:var(--primary-light); border-radius:10px; padding:8px; margin:8px 0;}
.bench-count.over{background:var(--danger-light); color:var(--danger);}
.icon-btn{border:none; background:#eef2f7; border-radius:10px; width:38px; height:38px; font-size:16px; flex-shrink:0;}
label.fld{display:block; margin:12px 0;}
label.fld span{display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:4px;}
label.fld input, label.fld textarea{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; background:#fff;
}
label.fld input:focus, label.fld textarea:focus{outline:none; border-color:var(--primary);}
.note{font-size:12px; color:var(--muted); margin:8px 4px;}

/* ===== タブバー ===== */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; background:#fff; border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -2px 10px rgba(16,42,67,.06);
}
#tabbar button{
  flex:1; border:none; background:none; padding:8px 0 6px; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
#tabbar button .ic{font-size:21px; line-height:1;}
#tabbar button .lb{font-size:10.5px; font-weight:700;}
#tabbar button.on{color:var(--primary);}

/* ===== モーダル ===== */
.modal{position:fixed; inset:0; z-index:50; display:none;}
.modal.show{display:block;}
.modal .ovl{position:absolute; inset:0; background:rgba(10,25,45,.5);}
.modal .panel{
  position:absolute; left:0; right:0; bottom:0; background:var(--bg);
  border-radius:20px 20px 0 0; max-height:88%; overflow:auto;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom));
}
.modal.full .panel{
  top:0; border-radius:0; max-height:none; padding:0;
  display:flex; flex-direction:column; overflow:hidden;
}
.m-head{
  position:sticky; top:0; z-index:5; background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  color:#fff; padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.m-head b{font-size:16px;}
.m-head .x{border:none; background:rgba(255,255,255,.18); color:#fff; border-radius:10px; width:36px; height:36px; font-size:17px; flex-shrink:0;}
.m-body{flex:1; overflow:auto; padding:12px 14px; -webkit-overflow-scrolling:touch;}
.m-foot{
  background:#fff; border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex; gap:8px;
}
.m-foot .btn{flex:1;}
.sheet-title{font-size:17px; font-weight:800; margin:2px 4px 12px;}

/* ===== 試合エディタ ===== */
.seg{display:flex; background:#e2e9f2; border-radius:12px; padding:4px; gap:4px; margin:6px 0;}
.seg button{flex:1; padding:10px 0; border:none; border-radius:9px; background:transparent; font-weight:700; color:var(--muted); font-size:15px;}
.seg button.on{background:#fff; color:var(--primary); box-shadow:0 1px 3px rgba(0,0,0,.15);}
.sel-head{display:flex; align-items:center; justify-content:space-between; margin:14px 2px 6px;}
.sel-head .ttl{font-size:14px; font-weight:700; color:var(--muted);}
.sel-cnt{font-size:18px; font-weight:800; color:var(--ok);}
.sel-cnt.ng{color:var(--danger);}
.quick{display:flex; gap:6px; margin:8px 0; flex-wrap:wrap;}
.quick .btn{flex:1; white-space:nowrap;}
.pgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0;}
.pchip{
  display:flex; align-items:center; gap:8px; border:2px solid var(--line); background:#fff;
  border-radius:12px; padding:9px 10px; text-align:left; min-height:52px;
}
.pchip .pn{width:30px; height:30px; border-radius:50%; background:#eef2f7; color:var(--text); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;}
.pchip .nm{flex:1; font-weight:700; font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pchip .pc{font-size:11px; font-weight:700; color:var(--muted); background:#eef2f7; border-radius:7px; padding:2px 6px; flex-shrink:0;}
.pchip .pc.zero{background:var(--danger-light); color:var(--danger);}
.pchip.sel{border-color:var(--primary); background:var(--primary-light);}
.pchip.sel .pn{background:var(--primary); color:#fff;}
.jgrid{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
.jchip{border:2px solid var(--line); background:#fff; border-radius:20px; padding:8px 14px; font-weight:700; font-size:14px;}
.jchip.sel{border-color:var(--accent); background:var(--accent-light); color:var(--accent);}
.hint{font-size:12px; color:var(--muted); margin:2px 4px;}

/* ===== メンバー表 ===== */
#sheetPaper{background:#fff; border-radius:14px; margin:4px 0 16px; padding:20px 16px 24px; box-shadow:0 1px 4px rgba(16,42,67,.1);}
#sheetPaper .team{text-align:center; font-size:20px; font-weight:800; letter-spacing:.03em;}
#sheetPaper .meta{text-align:center; font-size:14px; color:var(--muted); margin-top:4px;}
#sheetPaper .vs{text-align:center; font-size:17px; font-weight:700; margin:10px 0 2px;}
#sheetPaper .vs .fmt{background:var(--primary-light); color:var(--primary); font-size:13px; border-radius:8px; padding:2px 8px; margin-left:8px; vertical-align:2px;}
#sheetPaper .staff{
  display:flex; justify-content:center; gap:4px; flex-wrap:wrap; margin:12px 0;
  border-top:2px solid var(--primary-dark); border-bottom:1px solid var(--line); padding:10px 0;
}
#sheetPaper .staff div{flex:1; min-width:100px; text-align:center;}
#sheetPaper .staff span{display:block; font-size:11px; color:var(--muted); font-weight:700;}
#sheetPaper .staff b{font-size:15px;}
#sheetPaper .plist-head{font-size:13px; font-weight:700; color:var(--muted); margin:12px 2px 4px;}
.prow{display:flex; align-items:center; gap:12px; padding:9px 8px; border-bottom:1px solid var(--line);}
.prow .n{
  width:38px; height:38px; border-radius:50%; background:var(--primary-dark); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex-shrink:0;
}
.prow .nm{flex:1; font-size:18px; font-weight:700;}
.prow.jumper{background:var(--accent-light); border-radius:10px; border-bottom-color:transparent;}
.prow .jtag{background:var(--accent); color:#fff; font-size:12px; font-weight:800; border-radius:8px; padding:3px 9px; flex-shrink:0;}
#sheetPaper .foot-note{font-size:12px; color:var(--muted); text-align:center; margin-top:14px;}

/* ===== 日付リスト ===== */
.drow{display:flex; align-items:center; gap:10px; padding:12px; background:#fff; border-radius:12px; margin:6px 0; border:2px solid transparent;}
.drow.cur{border-color:var(--primary);}
.drow .di{flex:1; min-width:0;}
.drow .dd{font-weight:800; font-size:15px;}
.drow .dt{font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.drow .cur-badge{background:var(--primary); color:#fff; font-size:11px; font-weight:700; border-radius:6px; padding:2px 7px; flex-shrink:0;}

/* ===== トースト ===== */
#toast{
  position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-8px); z-index:99;
  background:#243447; color:#fff; padding:10px 18px; border-radius:12px; font-size:14px; font-weight:600;
  opacity:0; pointer-events:none; transition:all .25s; max-width:86%; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ===== 印刷(メンバー表のみ) ===== */
@media print{
  body{padding:0; background:#fff;}
  body > *{display:none !important;}
  #m-sheet{display:block !important; position:static;}
  #m-sheet .ovl, #m-sheet .m-head, #m-sheet .m-foot{display:none !important;}
  #m-sheet .panel{position:static; max-height:none; overflow:visible; padding:0; display:block;}
  #m-sheet .m-body{overflow:visible; padding:0;}
  #sheetPaper{box-shadow:none; border-radius:0; margin:0;}
}
</style>
</head>
<body>

<header id="hdr">
  <div class="t1">
    <span class="app-name">🏐 出場メンバー管理</span>
    <span class="team-name" id="hdrTeam"></span>
  </div>
  <button id="dayChip" onclick="openDays()">
    <span id="dayChipDate">--/--</span>
    <span class="sub" id="dayChipTitle"></span>
    <span>▾</span>
  </button>
</header>

<main>
  <!-- 試合タブ -->
  <section class="view" id="view-matches"></section>
  <!-- 出場回数タブ -->
  <section class="view" id="view-counts"></section>
  <!-- ベンチタブ -->
  <section class="view" id="view-bench"></section>
  <!-- 名簿タブ -->
  <section class="view" id="view-roster"></section>
</main>

<nav id="tabbar">
  <button id="tab-matches" onclick="switchTab('matches')"><span class="ic">📋</span><span class="lb">試合</span></button>
  <button id="tab-counts" onclick="switchTab('counts')"><span class="ic">📊</span><span class="lb">出場回数</span></button>
  <button id="tab-bench" onclick="switchTab('bench')"><span class="ic">🪑</span><span class="lb">ベンチ</span></button>
  <button id="tab-roster" onclick="switchTab('roster')"><span class="ic">📝</span><span class="lb">名簿</span></button>
</nav>

<!-- 試合エディタ -->
<div class="modal full" id="m-edit">
  <div class="panel">
    <div class="m-head">
      <b id="edTitle">試合の登録</b>
      <button class="x" onclick="closeEdit()">✕</button>
    </div>
    <div class="m-body">
      <label class="fld"><span>対戦相手（任意）</span>
        <input id="edOpp" placeholder="例：○○クラブ">
      </label>
      <div class="sel-head" style="margin-top:4px;"><span class="ttl">人数制ルール</span></div>
      <div class="seg" id="edSeg">
        <button onclick="setFormat(12)">12人制</button>
        <button onclick="setFormat(10)">10人制</button>
        <button onclick="setFormat(8)">8人制</button>
      </div>
      <div class="sel-head">
        <span class="ttl">出場メンバーを選択</span>
        <span class="sel-cnt" id="edCnt">0/12</span>
      </div>
      <p class="hint">※「○回」は当日の出場回数（この試合を除く）</p>
      <div class="quick">
        <button class="btn sm gray" onclick="autoPick()">⚡ 出場が少ない順に自動選択</button>
        <button class="btn sm gray" id="edCopyBtn" onclick="copyPrev()">前の試合と同じ</button>
        <button class="btn sm gray" onclick="clearSel()">全解除</button>
      </div>
      <div class="sort-row">
        <button id="edSortNum" onclick="setEdSort('num')">背番号順</button>
        <button id="edSortAsc" onclick="setEdSort('asc')">出場が少ない順</button>
      </div>
      <div class="pgrid" id="edGrid"></div>
      <div class="sel-head"><span class="ttl">ジャンパー（ジャンプボールを跳ぶ選手）</span></div>
      <p class="hint">選択した出場メンバーの中から1人タップ（もう一度タップで解除）</p>
      <div class="jgrid" id="edJump"></div>
      <div style="margin:16px 0;">
        <button class="btn danger block" id="edDelBtn" onclick="deleteMatch()">🗑 この試合を削除</button>
      </div>
    </div>
    <div class="m-foot">
      <button class="btn gray" onclick="closeEdit()">キャンセル</button>
      <button class="btn" onclick="saveMatch()">保存する</button>
    </div>
  </div>
</div>

<!-- メンバー表 -->
<div class="modal full" id="m-sheet">
  <div class="panel">
    <div class="m-head">
      <b>メンバー表</b>
      <button class="x" onclick="closeSheet()">✕</button>
    </div>
    <div class="m-body">
      <div id="sheetPaper"></div>
      <p class="note" style="text-align:center;">スクリーンショットを撮って共有できます</p>
    </div>
    <div class="m-foot">
      <button class="btn gray" onclick="closeSheet()">閉じる</button>
      <button class="btn ghost" onclick="window.print()">🖨 印刷 / PDF</button>
    </div>
  </div>
</div>

<!-- 日付管理 -->
<div class="modal" id="m-days">
  <div class="ovl" onclick="closeDays()"></div>
  <div class="panel">
    <div class="sheet-title">📅 日付の管理</div>
    <div class="card" style="margin-top:0;">
      <label class="fld" style="margin-top:0;"><span>日付</span><input type="date" id="newDayDate"></label>
      <label class="fld"><span>大会名・練習試合名（任意）</span><input id="newDayTitle" placeholder="例：○○カップ、△△招待練習試合"></label>
      <button class="btn block" onclick="createDay()">＋ この日を作成して切り替え</button>
      <p class="note" style="margin-bottom:0;">※ベンチメンバーは現在の日からコピーされます</p>
    </div>
    <h2 class="sec">保存されている日</h2>
    <div id="daysList"></div>
  </div>
</div>

<!-- メンバー追加/編集 -->
<div class="modal" id="m-member">
  <div class="ovl" onclick="closeMember()"></div>
  <div class="panel">
    <div class="sheet-title" id="memTitle">メンバーを追加</div>
    <label class="fld"><span>背番号</span><input type="number" id="memNum" min="0" max="999" inputmode="numeric"></label>
    <label class="fld"><span>名前</span><input id="memName" placeholder="例：山田 太郎"></label>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn gray" style="flex:1;" onclick="closeMember()">キャンセル</button>
      <button class="btn" style="flex:1;" onclick="saveMember()">保存</button>
    </div>
    <button class="btn danger block" id="memDelBtn" style="margin-top:10px;" onclick="deleteMemberFromModal()">🗑 このメンバーを削除</button>
  </div>
</div>

<!-- まとめて追加 -->
<div class="modal" id="m-bulk">
  <div class="ovl" onclick="closeBulk()"></div>
  <div class="panel">
    <div class="sheet-title">まとめて追加</div>
    <p class="note" style="margin-top:0;">1行に1人ずつ名前を入力してください。<br>「背番号 名前」の形式（例：<b>7 山田太郎</b>）でも登録できます。番号を書かない場合は自動で連番が付きます。</p>
    <label class="fld"><textarea id="bulkText" rows="8" placeholder="1 佐藤一郎&#10;2 鈴木二郎&#10;3 高橋三郎"></textarea></label>
    <div style="display:flex; gap:8px;">
      <button class="btn gray" style="flex:1;" onclick="closeBulk()">キャンセル</button>
      <button class="btn" style="flex:1;" onclick="bulkAdd()">追加する</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none;" onchange="importData(this)">

<script>
'use strict';
/* =====================================================
   ドッジボール 出場メンバー管理 v1
   データはこの端末のブラウザ内(localStorage)に保存されます
===================================================== */
var LS_KEY = 'dodge_member_mgr_v1';
var BENCH_MAX = 20;
var WD = ['日','月','火','水','木','金','土'];

var S = null;            // アプリ全データ
var curTab = 'matches';  // 表示中タブ
var cSort = 'num';       // 出場回数タブの並び順 num|asc|desc（デフォルトは背番号順）
var ED = null;           // 試合エディタの編集中データ
var edSort = 'num';      // エディタ内の並び順
var memEditId = null;    // メンバー編集対象id

/* ---------- ユーティリティ ---------- */
function $(id){ return document.getElementById(id); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso, full){
  var p = (iso || '').split('-');
  if(p.length !== 3) return iso || '';
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  var w = WD[d.getDay()];
  return full ? (+p[0]) + '年' + (+p[1]) + '月' + (+p[2]) + '日（' + w + '）'
              : (+p[1]) + '/' + (+p[2]) + '（' + w + '）';
}
var toastTimer = null;
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ---------- データ ---------- */
function newDay(date, title, benchIds){
  return { id: uid(), date: date, title: title || '', benchIds: benchIds || [], matches: [] };
}
function defaultState(){
  var day = newDay(todayStr(), '');
  return {
    ver: 1,
    teamName: '',
    staff: { director: '', coach: '', manager: '' },
    members: [],                // [{id, num, name}]
    days: [day],
    currentDayId: day.id
  };
}
function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    var s = JSON.parse(raw);
    if(!s || !Array.isArray(s.members) || !Array.isArray(s.days) || !s.days.length) return null;
    if(!s.staff) s.staff = { director:'', coach:'', manager:'' };
    s.days.forEach(function(d){
      if(!Array.isArray(d.benchIds)) d.benchIds = [];
      if(!Array.isArray(d.matches)) d.matches = [];
    });
    if(!s.days.some(function(d){ return d.id === s.currentDayId; })) s.currentDayId = s.days[0].id;
    return s;
  }catch(e){ return null; }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ toast('⚠ データの保存に失敗しました'); }
}
function curDay(){
  for(var i=0; i<S.days.length; i++) if(S.days[i].id === S.currentDayId) return S.days[i];
  return S.days[0];
}
function member(id){
  for(var i=0; i<S.members.length; i++) if(S.members[i].id === id) return S.members[i];
  return null;
}
function byNum(a, b){ return (a.num - b.num) || a.name.localeCompare(b.name, 'ja'); }

/* その日の出場回数 {memberId: count}（excludeId の試合を除く） */
function countsFor(day, excludeId){
  var c = {};
  day.matches.forEach(function(m){
    if(m.id === excludeId) return;
    m.playerIds.forEach(function(pid){ c[pid] = (c[pid] || 0) + 1; });
  });
  return c;
}
/* その日メンバーが出た試合番号(1始まり)一覧 */
function matchNosFor(day, memberId){
  var out = [];
  day.matches.forEach(function(m, i){
    if(m.playerIds.indexOf(memberId) >= 0) out.push(i + 1);
  });
  return out;
}
/* 出場回数タブに載せる対象：ベンチ入り + 試合に出た人（重複なし） */
function countTargets(day){
  var ids = day.benchIds.slice();
  day.matches.forEach(function(m){
    m.playerIds.forEach(function(pid){ if(ids.indexOf(pid) < 0) ids.push(pid); });
  });
  return ids.map(member).filter(Boolean);
}

/* ---------- タブ切替 ---------- */
function switchTab(tab){
  curTab = tab;
  ['matches','counts','bench','roster'].forEach(function(t){
    $('view-' + t).classList.toggle('on', t === tab);
    $('tab-' + t).classList.toggle('on', t === tab);
  });
  render();
  window.scrollTo(0, 0);
}

/* ---------- 描画 ---------- */
function render(){
  renderHeader();
  if(curTab === 'matches') renderMatches();
  else if(curTab === 'counts') renderCounts();
  else if(curTab === 'bench') renderBench();
  else renderRoster();
}
function renderHeader(){
  var d = curDay();
  $('hdrTeam').textContent = S.teamName || '';
  $('dayChipDate').textContent = '📅 ' + fmtDate(d.date);
  $('dayChipTitle').textContent = d.title || '（大会名未設定）';
}

/* ----- 試合タブ ----- */
function renderMatches(){
  var v = $('view-matches');
  var d = curDay();
  if(S.members.length === 0){
    v.innerHTML =
      '<div class="empty"><div class="big">📝</div>' +
      '<p>まずはクラブ員を名簿に登録しましょう。<br>「まとめて追加」を使うと簡単です。</p>' +
      '<button class="btn" onclick="switchTab(\'roster\')">名簿タブへ</button></div>';
    return;
  }
  if(d.benchIds.length === 0){
    v.innerHTML =
      '<div class="empty"><div class="big">🪑</div>' +
      '<p>この日のベンチ入りメンバー（最大' + BENCH_MAX + '人）を<br>選択しましょう。</p>' +
      '<button class="btn" onclick="switchTab(\'bench\')">ベンチタブへ</button></div>';
    return;
  }
  var html = '';
  html += '<div class="summary">' +
    '<div class="box"><b>' + d.matches.length + '</b><span>試合</span></div>' +
    '<div class="box"><b>' + d.benchIds.length + '</b><span>ベンチ入り</span></div>' +
    '</div>';
  if(d.matches.length === 0){
    html += '<div class="empty"><div class="big">🏐</div><p>まだ試合がありません。<br>下のボタンから追加してください。</p></div>';
  }
  d.matches.forEach(function(m, i){
    var n = m.playerIds.length;
    var ok = (n === m.format);
    var j = m.jumperId ? member(m.jumperId) : null;
    html += '<div class="match-card" onclick="openMatch(\'' + m.id + '\')">' +
      '<div class="row1"><span class="mno">第' + (i+1) + '試合</span>' +
      '<span class="fmt">' + m.format + '人制</span></div>' +
      (m.opponent ? '<div class="opp">vs ' + esc(m.opponent) + '</div>' : '') +
      '<div class="row2">' +
        '<span>👥 <span class="' + (ok ? 'cnt-ok' : 'cnt-ng') + '">' + n + '/' + m.format + '人</span></span>' +
        (j ? '<span class="jmp">★J ' + esc(j.name) + '</span>' : '<span style="color:#b0bac6;">★J 未設定</span>') +
      '</div>' +
      '<div class="row3">' +
        '<button class="btn sm ghost" onclick="event.stopPropagation(); openSheet(\'' + m.id + '\')">📄 メンバー表</button>' +
        '<button class="btn sm gray" onclick="event.stopPropagation(); openMatch(\'' + m.id + '\')">✎ 編集</button>' +
      '</div></div>';
  });
  html += '<button class="btn block" style="margin:14px 0 6px;" onclick="openMatch(null)">＋ 試合を追加</button>';
  v.innerHTML = html;
}

/* ----- 出場回数タブ ----- */
function renderCounts(){
  var v = $('view-counts');
  var d = curDay();
  var targets = countTargets(d);
  if(targets.length === 0){
    v.innerHTML = '<div class="empty"><div class="big">📊</div><p>ベンチ入りメンバーを選ぶと<br>ここに出場回数が表示されます。</p>' +
      '<button class="btn" onclick="switchTab(\'bench\')">ベンチタブへ</button></div>';
    return;
  }
  var counts = countsFor(d, null);
  var maxC = 1;
  targets.forEach(function(m){ maxC = Math.max(maxC, counts[m.id] || 0); });

  var list = targets.slice();
  if(cSort === 'num') list.sort(byNum);
  else if(cSort === 'asc') list.sort(function(a,b){ return ((counts[a.id]||0) - (counts[b.id]||0)) || byNum(a,b); });
  else list.sort(function(a,b){ return ((counts[b.id]||0) - (counts[a.id]||0)) || byNum(a,b); });

  var html = '<div class="summary">' +
    '<div class="box"><b>' + d.matches.length + '</b><span>試合</span></div>' +
    '<div class="box"><b>' + targets.length + '</b><span>対象メンバー</span></div>' +
    '</div>';
  html += '<div class="sort-row">' +
    '<button class="' + (cSort==='num'?'on':'') + '" onclick="setCSort(\'num\')">背番号順</button>' +
    '<button class="' + (cSort==='asc'?'on':'') + '" onclick="setCSort(\'asc\')">少ない順</button>' +
    '<button class="' + (cSort==='desc'?'on':'') + '" onclick="setCSort(\'desc\')">多い順</button></div>';
  list.forEach(function(m){
    var c = counts[m.id] || 0;
    var nos = matchNosFor(d, m.id);
    html += '<div class="crow' + (c===0 ? ' zero' : '') + '">' +
      '<div class="num">' + esc(m.num) + '</div>' +
      '<div class="info"><div class="nm">' + esc(m.name) + (c===0 ? '<span class="zero-badge">未出場</span>' : '') + '</div>' +
      '<div class="bar"><i style="width:' + Math.round(c/maxC*100) + '%"></i></div>' +
      (nos.length ? '<div class="games">出場：第' + nos.join('・') + '試合</div>' : '') +
      '</div>' +
      '<div class="cntbox"><span class="cnt">' + c + '<small>回</small></span></div>' +
      '</div>';
  });
  html += '<p class="note">※回数はこの日（' + fmtDate(d.date) + '）の出場試合数です</p>';
  v.innerHTML = html;
}
function setCSort(s){ cSort = s; renderCounts(); }

/* ----- ベンチタブ ----- */
function renderBench(){
  var v = $('view-bench');
  var d = curDay();
  if(S.members.length === 0){
    v.innerHTML = '<div class="empty"><div class="big">📝</div><p>先に名簿タブでクラブ員を登録してください。</p>' +
      '<button class="btn" onclick="switchTab(\'roster\')">名簿タブへ</button></div>';
    return;
  }
  var over = d.benchIds.length > BENCH_MAX;
  var html = '<p class="note" style="margin-top:2px;">' + fmtDate(d.date) + ' にベンチ入りするメンバー（最大' + BENCH_MAX + '人）をタップして選択します。</p>';
  html += '<div class="bench-count' + (over?' over':'') + '">ベンチ入り ' + d.benchIds.length + ' / ' + BENCH_MAX + ' 人</div>';
  html += '<div style="display:flex; gap:6px; margin:8px 0;">' +
    '<button class="btn sm gray" style="flex:1;" onclick="benchSelectAll()">全員選択（先頭' + BENCH_MAX + '人まで）</button>' +
    '<button class="btn sm gray" style="flex:1;" onclick="benchClear()">全解除</button></div>';
  S.members.slice().sort(byNum).forEach(function(m){
    var sel = d.benchIds.indexOf(m.id) >= 0;
    html += '<div class="mrow bench-row' + (sel?' sel':'') + '" onclick="benchToggle(\'' + m.id + '\')">' +
      '<div class="num">' + esc(m.num) + '</div>' +
      '<div class="nm">' + esc(m.name) + '</div>' +
      '<div class="chk">' + (sel ? '✓' : '') + '</div></div>';
  });
  v.innerHTML = html;
}
function benchToggle(id){
  var d = curDay();
  var i = d.benchIds.indexOf(id);
  if(i >= 0){ d.benchIds.splice(i, 1); }
  else{
    if(d.benchIds.length >= BENCH_MAX){ toast('ベンチ入りは最大' + BENCH_MAX + '人までです'); return; }
    d.benchIds.push(id);
  }
  save(); renderBench();
}
function benchSelectAll(){
  var d = curDay();
  d.benchIds = S.members.slice().sort(byNum).slice(0, BENCH_MAX).map(function(m){ return m.id; });
  if(S.members.length > BENCH_MAX) toast('先頭' + BENCH_MAX + '人を選択しました');
  save(); renderBench();
}
function benchClear(){
  curDay().benchIds = [];
  save(); renderBench();
}

/* ----- 名簿タブ ----- */
function renderRoster(){
  var v = $('view-roster');
  var html = '';
  html += '<div class="card" style="margin-top:2px;">' +
    '<label class="fld" style="margin-top:0;"><span>チーム名</span>' +
    '<input id="inTeam" value="' + esc(S.teamName) + '" placeholder="例：○○ドッジボールクラブ" onchange="setTeam(this.value)"></label>' +
    '<label class="fld"><span>監督</span><input value="' + esc(S.staff.director) + '" placeholder="名前" onchange="setStaff(\'director\', this.value)"></label>' +
    '<label class="fld"><span>コーチ</span><input value="' + esc(S.staff.coach) + '" placeholder="名前" onchange="setStaff(\'coach\', this.value)"></label>' +
    '<label class="fld" style="margin-bottom:2px;"><span>マネージャー</span><input value="' + esc(S.staff.manager) + '" placeholder="名前" onchange="setStaff(\'manager\', this.value)"></label>' +
    '</div>';
  html += '<h2 class="sec">クラブ員名簿（' + S.members.length + '人）</h2>';
  html += '<div style="display:flex; gap:6px; margin:8px 0;">' +
    '<button class="btn sm" style="flex:1;" onclick="openMember(null)">＋ 1人追加</button>' +
    '<button class="btn sm ghost" style="flex:1;" onclick="openBulk()">まとめて追加</button></div>';
  if(S.members.length === 0){
    html += '<div class="empty" style="padding:20px;"><p style="margin:0;">まだ登録がありません</p></div>';
  }
  S.members.slice().sort(byNum).forEach(function(m){
    html += '<div class="mrow">' +
      '<div class="num">' + esc(m.num) + '</div>' +
      '<div class="nm">' + esc(m.name) + '</div>' +
      '<button class="icon-btn" onclick="openMember(\'' + m.id + '\')">✎</button>' +
      '</div>';
  });
  html += '<h2 class="sec">データ管理</h2>' +
    '<div class="card">' +
    '<p class="note" style="margin-top:0;">データはこの端末のブラウザ内に自動保存されます。ブラウザのデータ消去で消えることがあるため、ときどきバックアップの書き出しをおすすめします。</p>' +
    '<div style="display:flex; gap:8px;">' +
    '<button class="btn sm ghost" style="flex:1;" onclick="exportData()">📤 バックアップ書き出し</button>' +
    '<button class="btn sm gray" style="flex:1;" onclick="$(\'importFile\').click()">📥 読み込み</button>' +
    '</div></div>' +
    '<p class="note" style="text-align:center;">出場メンバー管理 v1</p>';
  v.innerHTML = html;
}
function setTeam(vl){ S.teamName = vl.trim(); save(); renderHeader(); }
function setStaff(k, vl){ S.staff[k] = vl.trim(); save(); }

/* ----- メンバー追加/編集 ----- */
function nextNum(){
  var mx = 0;
  S.members.forEach(function(m){ mx = Math.max(mx, m.num || 0); });
  return mx + 1;
}
function openMember(id){
  memEditId = id;
  var m = id ? member(id) : null;
  $('memTitle').textContent = m ? 'メンバーを編集' : 'メンバーを追加';
  $('memNum').value = m ? m.num : nextNum();
  $('memName').value = m ? m.name : '';
  $('memDelBtn').style.display = m ? 'flex' : 'none';
  $('m-member').classList.add('show');
  if(!m) setTimeout(function(){ $('memName').focus(); }, 100);
}
function closeMember(){ $('m-member').classList.remove('show'); }
function saveMember(){
  var name = $('memName').value.trim();
  var num = parseInt($('memNum').value, 10);
  if(!name){ toast('名前を入力してください'); return; }
  if(isNaN(num) || num < 0){ toast('背番号を入力してください'); return; }
  if(memEditId){
    var m = member(memEditId);
    if(m){ m.name = name; m.num = num; }
  }else{
    S.members.push({ id: uid(), num: num, name: name });
  }
  save(); closeMember(); render();
}
function deleteMemberFromModal(){
  var m = member(memEditId);
  if(!m) return;
  if(!confirm('「' + m.name + '」を削除しますか？\nすべての日のベンチ・試合データからも取り除かれます。')) return;
  S.members = S.members.filter(function(x){ return x.id !== memEditId; });
  S.days.forEach(function(d){
    d.benchIds = d.benchIds.filter(function(x){ return x !== memEditId; });
    d.matches.forEach(function(mt){
      mt.playerIds = mt.playerIds.filter(function(x){ return x !== memEditId; });
      if(mt.jumperId === memEditId) mt.jumperId = null;
    });
  });
  save(); closeMember(); render();
  toast('削除しました');
}
function openBulk(){ $('bulkText').value = ''; $('m-bulk').classList.add('show'); }
function closeBulk(){ $('m-bulk').classList.remove('show'); }
function bulkAdd(){
  var lines = $('bulkText').value.split('\n');
  var added = 0, auto = nextNum();
  lines.forEach(function(line){
    var t = line.trim();
    if(!t) return;
    var mch = t.match(/^(\d{1,3})[\s,、．.　]+(.+)$/);
    var num, name;
    if(mch){ num = parseInt(mch[1], 10); name = mch[2].trim(); }
    else{ num = auto++; name = t; }
    if(!name) return;
    S.members.push({ id: uid(), num: num, name: name });
    added++;
  });
  if(!added){ toast('追加できる行がありません'); return; }
  save(); closeBulk(); render();
  toast(added + '人を追加しました');
}

/* ----- 日付管理 ----- */
function openDays(){
  $('newDayDate').value = todayStr();
  $('newDayTitle').value = '';
  renderDaysList();
  $('m-days').classList.add('show');
}
function closeDays(){ $('m-days').classList.remove('show'); }
function renderDaysList(){
  var html = '';
  var sorted = S.days.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
  sorted.forEach(function(d){
    var cur = (d.id === S.currentDayId);
    html += '<div class="drow' + (cur?' cur':'') + '" onclick="selectDay(\'' + d.id + '\')">' +
      '<div class="di"><div class="dd">' + fmtDate(d.date) + '</div>' +
      '<div class="dt">' + (d.title ? esc(d.title) : '（名称なし）') + '・' + d.matches.length + '試合</div></div>' +
      (cur ? '<span class="cur-badge">表示中</span>' : '') +
      '<button class="icon-btn" onclick="event.stopPropagation(); deleteDay(\'' + d.id + '\')">🗑</button>' +
      '</div>';
  });
  $('daysList').innerHTML = html;
}
function createDay(){
  var date = $('newDayDate').value;
  if(!date){ toast('日付を選択してください'); return; }
  var title = $('newDayTitle').value.trim();
  var d = newDay(date, title, curDay().benchIds.slice());
  S.days.push(d);
  S.currentDayId = d.id;
  save(); closeDays(); switchTab('matches');
  toast(fmtDate(date) + ' を作成しました');
}
function selectDay(id){
  S.currentDayId = id;
  save(); closeDays(); render();
}
function deleteDay(id){
  var d = null;
  S.days.forEach(function(x){ if(x.id === id) d = x; });
  if(!d) return;
  if(S.days.length === 1){ toast('最後の1日は削除できません'); return; }
  if(!confirm(fmtDate(d.date) + (d.title ? '「' + d.title + '」' : '') + ' を削除しますか？\nこの日の試合データもすべて消えます。')) return;
  S.days = S.days.filter(function(x){ return x.id !== id; });
  if(S.currentDayId === id){
    var sorted = S.days.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
    S.currentDayId = sorted[0].id;
  }
  save(); renderDaysList(); render();
}

/* ----- 試合エディタ ----- */
function openMatch(matchId){
  var d = curDay();
  if(d.benchIds.length === 0){
    toast('先にベンチタブでベンチ入りメンバーを選んでください');
    switchTab('bench');
    return;
  }
  var m = null, idx = -1;
  d.matches.forEach(function(x, i){ if(x.id === matchId){ m = x; idx = i; } });
  ED = m
    ? { matchId: m.id, idx: idx, opponent: m.opponent, format: m.format, playerIds: m.playerIds.slice(), jumperId: m.jumperId }
    : { matchId: null, idx: d.matches.length, opponent: '', format: 12, playerIds: [], jumperId: null };
  $('edTitle').textContent = '第' + (ED.idx + 1) + '試合' + (m ? 'の編集' : 'を登録');
  $('edOpp').value = ED.opponent;
  $('edDelBtn').style.display = m ? 'flex' : 'none';
  // 「前の試合と同じ」：直前の試合がある場合のみ
  $('edCopyBtn').style.display = (ED.idx > 0) ? 'inline-flex' : 'none';
  renderEditor();
  $('m-edit').classList.add('show');
  $('m-edit').querySelector('.m-body').scrollTop = 0;
}
function closeEdit(){ ED = null; $('m-edit').classList.remove('show'); }
function setFormat(n){
  ED.format = n;
  if(ED.playerIds.length > n) toast(n + '人制です。メンバーを' + n + '人まで減らしてください');
  renderEditor();
}
function setEdSort(s){ edSort = s; renderEditor(); }
function togglePlayer(id){
  var i = ED.playerIds.indexOf(id);
  if(i >= 0){
    ED.playerIds.splice(i, 1);
    if(ED.jumperId === id) ED.jumperId = null;
  }else{
    if(ED.playerIds.length >= ED.format){ toast(ED.format + '人制では' + ED.format + '人までです'); return; }
    ED.playerIds.push(id);
  }
  renderEditor();
}
function setJumper(id){
  ED.jumperId = (ED.jumperId === id) ? null : id;
  renderEditor();
}
function autoPick(){
  var d = curDay();
  var counts = countsFor(d, ED.matchId);
  var pool = d.benchIds.map(member).filter(Boolean)
    .sort(function(a,b){ return ((counts[a.id]||0) - (counts[b.id]||0)) || byNum(a,b); });
  ED.playerIds = pool.slice(0, ED.format).map(function(m){ return m.id; });
  if(ED.jumperId && ED.playerIds.indexOf(ED.jumperId) < 0) ED.jumperId = null;
  renderEditor();
  toast('出場が少ない順に' + ED.playerIds.length + '人を選択しました');
}
function copyPrev(){
  var d = curDay();
  var prev = d.matches[ED.idx - 1];
  if(!prev){ toast('前の試合がありません'); return; }
  ED.playerIds = prev.playerIds.filter(function(id){ return member(id); }).slice(0, ED.format);
  ED.jumperId = (prev.jumperId && ED.playerIds.indexOf(prev.jumperId) >= 0) ? prev.jumperId : null;
  renderEditor();
  toast('第' + ED.idx + '試合のメンバーをコピーしました');
}
function clearSel(){
  ED.playerIds = [];
  ED.jumperId = null;
  renderEditor();
}
function renderEditor(){
  var d = curDay();
  var counts = countsFor(d, ED.matchId);
  // 人数制セグメント
  var segs = $('edSeg').children;
  [12,10,8].forEach(function(n, i){ segs[i].classList.toggle('on', ED.format === n); });
  // カウンタ
  var cntEl = $('edCnt');
  cntEl.textContent = ED.playerIds.length + '/' + ED.format;
  cntEl.classList.toggle('ng', ED.playerIds.length !== ED.format);
  // 並び順ボタン
  $('edSortNum').classList.toggle('on', edSort === 'num');
  $('edSortAsc').classList.toggle('on', edSort === 'asc');
  // メンバーグリッド
  var pool = d.benchIds.map(member).filter(Boolean);
  if(edSort === 'num') pool.sort(byNum);
  else pool.sort(function(a,b){ return ((counts[a.id]||0) - (counts[b.id]||0)) || byNum(a,b); });
  var html = '';
  pool.forEach(function(m){
    var sel = ED.playerIds.indexOf(m.id) >= 0;
    var c = counts[m.id] || 0;
    html += '<button class="pchip' + (sel?' sel':'') + '" onclick="togglePlayer(\'' + m.id + '\')">' +
      '<span class="pn">' + esc(m.num) + '</span>' +
      '<span class="nm">' + esc(m.name) + '</span>' +
      '<span class="pc' + (c===0?' zero':'') + '">' + c + '回</span></button>';
  });
  $('edGrid').innerHTML = html;
  // ジャンパー
  var jhtml = '';
  var selMembers = ED.playerIds.map(member).filter(Boolean).sort(byNum);
  if(selMembers.length === 0){
    jhtml = '<p class="hint" style="margin:4px 0;">先に出場メンバーを選択してください</p>';
  }else{
    selMembers.forEach(function(m){
      var isJ = ED.jumperId === m.id;
      jhtml += '<button class="jchip' + (isJ?' sel':'') + '" onclick="setJumper(\'' + m.id + '\')">' +
        (isJ ? '★ ' : '') + esc(m.num) + ' ' + esc(m.name) + '</button>';
    });
  }
  $('edJump').innerHTML = jhtml;
}
function saveMatch(){
  if(!ED) return;
  if(ED.playerIds.length > ED.format){
    toast(ED.format + '人制です。メンバーを' + ED.format + '人以下にしてください');
    return;
  }
  ED.opponent = $('edOpp').value.trim();
  var d = curDay();
  if(ED.matchId){
    d.matches.forEach(function(m){
      if(m.id === ED.matchId){
        m.opponent = ED.opponent; m.format = ED.format;
        m.playerIds = ED.playerIds.slice(); m.jumperId = ED.jumperId;
      }
    });
  }else{
    d.matches.push({
      id: uid(), opponent: ED.opponent, format: ED.format,
      playerIds: ED.playerIds.slice(), jumperId: ED.jumperId
    });
  }
  var shortage = ED.format - ED.playerIds.length;
  save(); closeEdit(); switchTab('matches');
  toast(shortage > 0 ? '保存しました（あと' + shortage + '人選べます）' : '保存しました');
}
function deleteMatch(){
  if(!ED || !ED.matchId) return;
  if(!confirm('第' + (ED.idx + 1) + '試合を削除しますか？')) return;
  var d = curDay();
  d.matches = d.matches.filter(function(m){ return m.id !== ED.matchId; });
  save(); closeEdit(); render();
  toast('削除しました');
}

/* ----- メンバー表 ----- */
function openSheet(matchId){
  var d = curDay();
  var m = null, idx = -1;
  d.matches.forEach(function(x, i){ if(x.id === matchId){ m = x; idx = i; } });
  if(!m) return;
  var players = m.playerIds.map(member).filter(Boolean).sort(byNum);
  var html = '';
  html += '<div class="team">' + (S.teamName ? esc(S.teamName) : 'チーム名未設定') + '</div>';
  html += '<div class="meta">' + fmtDate(d.date, true) + (d.title ? '　' + esc(d.title) : '') + '</div>';
  html += '<div class="vs">第' + (idx + 1) + '試合' + (m.opponent ? '　vs ' + esc(m.opponent) : '') +
          '<span class="fmt">' + m.format + '人制</span></div>';
  html += '<div class="staff">' +
    '<div><span>監督</span><b>' + (S.staff.director ? esc(S.staff.director) : '－') + '</b></div>' +
    '<div><span>コーチ</span><b>' + (S.staff.coach ? esc(S.staff.coach) : '－') + '</b></div>' +
    '<div><span>マネージャー</span><b>' + (S.staff.manager ? esc(S.staff.manager) : '－') + '</b></div>' +
    '</div>';
  html += '<div class="plist-head">出場メンバー（' + players.length + '人）</div>';
  if(players.length === 0){
    html += '<p class="note" style="text-align:center;">メンバーが未登録です</p>';
  }
  players.forEach(function(p){
    var isJ = (m.jumperId === p.id);
    html += '<div class="prow' + (isJ?' jumper':'') + '">' +
      '<span class="n">' + esc(p.num) + '</span>' +
      '<span class="nm">' + esc(p.name) + '</span>' +
      (isJ ? '<span class="jtag">★ ジャンパー</span>' : '') +
      '</div>';
  });
  html += '<div class="foot-note">★ ジャンパー＝ジャンプボールを跳ぶ選手</div>';
  $('sheetPaper').innerHTML = html;
  $('m-sheet').classList.add('show');
  $('m-sheet').querySelector('.m-body').scrollTop = 0;
}
function closeSheet(){ $('m-sheet').classList.remove('show'); }

/* ----- バックアップ ----- */
function exportData(){
  try{
    var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    var d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = '出場メンバー管理_バックアップ_' + d.getFullYear() +
      String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('バックアップを書き出しました');
  }catch(e){ toast('書き出しに失敗しました'); }
}
function importData(input){
  var file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var s = JSON.parse(reader.result);
      if(!s || !Array.isArray(s.members) || !Array.isArray(s.days) || !s.days.length) throw new Error('bad');
      if(!confirm('現在のデータをバックアップの内容で置き換えます。よろしいですか？')) return;
      localStorage.setItem(LS_KEY, JSON.stringify(s));
      S = load();
      render();
      toast('読み込みました');
    }catch(e){ toast('ファイルを読み込めませんでした'); }
  };
  reader.readAsText(file);
}

/* ---------- 起動 ---------- */
S = load();
if(!S){ S = defaultState(); save(); }
// 表示中の日が今日より前しかない場合でも、そのまま表示（履歴確認できるように）
switchTab('matches');

/* Web公開(https)時のみ：オフライン対応＋ホーム画面アプリ化のためのService Worker */
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
